<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4CAF50" />
    <meta
      name="description"
      content="Annadata - Agricultural Resources Platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- IMPORTANT: Remove the script tag - we will add it dynamically -->
    
    <title>Annadata</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Critical Google Translate styles -->
    <style>
      /* Make sure Google Translate displays correctly */
      body {
        top: 0 !important;
        position: static !important;
      }
      
      .goog-te-banner-frame, 
      .skiptranslate {
        display: none !important;
        visibility: hidden !important;
      }
      
      .goog-te-gadget select, 
      .goog-te-combo {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        width: 100% !important;
        min-width: 100px !important;
        max-width: 250px !important;
        height: auto !important;
        padding: 8px !important;
        margin: 20px auto !important;
        background-color: white !important;
        color: black !important;
        border: none !important;
        border-radius: 5px !important;
        font-size: 16px !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) !important;
      }
      
      .goog-te-gadget {
        color: white !important;
      }
      
      .goog-te-gadget img,
      .goog-te-gadget a,
      .goog-te-gadget span:not(.goog-te-combo) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Google Translate initialization - copied from EJS -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
      }
      
      // Function to hide the language popup
      function hideLanguagePopup() {
        var popup = document.getElementById('languagePopup');
        if (popup) {
            popup.style.display = 'none';
        }
      }
      
      // Fix Google Translate UI on page load
      window.addEventListener('load', function() {
        // Fix the body position
        document.body.style.top = '0px';
        document.body.style.position = 'static';
        
        // Hide the banner
        var elements = document.querySelectorAll('.goog-te-banner-frame, .skiptranslate');
        for (var i = 0; i < elements.length; i++) {
          if (elements[i]) {
            elements[i].style.display = 'none';
          }
        }
      });
    </script>
  </body>
</html>
